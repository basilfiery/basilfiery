<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BasilFiery — Pedido pelo tablet na mesa</title>
    <meta name="description" content="Cardápio digital no tablet: o cliente pede na mesa, a cozinha recebe impresso e o garçom é avisado no celular. Painel com pedidos ao vivo e controle de estoque." />
    <meta name="theme-color" content="#121010" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/icone-180.png" />
    <script>
      // Manifesto certo para cada app, escolhido ANTES da página carregar: o iPhone lê o manifesto na hora
      // e é ele que decide o que o atalho da tela de início abre.
      //   /dono      → app do dono        /appgarcom, /g → app do garçom
      //   painel, login e site → sistema   cardápio, mesas, listas → sem manifesto (o iPhone salva o endereço exato)
      (function () {
        var p = location.pathname, h = location.hostname, href = null, fixo = false, titulo = null;
        var sistema = /(^|\.)basilfiery\.com(\.br)?$|vercel\.app$|^localhost$|^[\d.]+$/.test(h);
        if (p === '/dono' || p.indexOf('/dono/') === 0) {
          href = '/manifest-dono.webmanifest'; fixo = true;
          try { titulo = JSON.parse(localStorage.getItem('bf:dono:nome-app') || 'null'); } catch (e) { titulo = null; }
        } else if (p === '/appgarcom' || p === '/g' || p.indexOf('/g/') === 0) {
          href = '/manifest-garcom.webmanifest'; fixo = true;
        } else if (sistema && (p === '/' || p === '/login' || p === '/ativar' || p === '/plataforma' || p.indexOf('/painel') === 0)) {
          href = '/manifest.webmanifest';
        }
        if (href) document.write('<link rel="manifest" href="' + href + '"' + (fixo ? ' data-fixo' : '') + ' />');
        if (titulo) document.write('<meta name="apple-mobile-web-app-title" content="' + String(titulo).replace(/[<>"&]/g, '') + '" />');
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // "Manter conectado" desmarcado: ao abrir o navegador de novo, a sessão do sistema começa deslogada
      try {
        if (localStorage.getItem('bf:sessao-temporaria') && !sessionStorage.getItem('bf:sessao-viva')) {
          localStorage.removeItem('bf:sessao-temporaria');
          localStorage.removeItem('sb-bceeeeielhqbtdiaiypi-auth-token');
        }
      } catch (e) { /* sem armazenamento */ }
    </script>
  </head>
  <body>
    <!-- Aparece enquanto o sistema carrega. Se algo travar, depois de 10 s mostra a opção de recarregar
         (nunca fica uma tela preta sem saída). Estilos aqui mesmo, caso o CSS não tenha carregado. -->
    <div id="root">
      <div class="bf-inicio">
        <img src="/favicon.png" width="56" height="56" alt="" />
        <p>Carregando o BasilFiery…</p>
        <a href="/" class="bf-inicio__recarregar" onclick="location.replace(location.pathname + '?_v=' + Date.now()); return false;">
          Está demorando? Clique para recarregar
        </a>
      </div>
    </div>
    <style>
      .bf-inicio { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 12px; margin: 0;
        background: #121010; color: #b3a69b; font: 15px system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
      .bf-inicio img { border-radius: 14px; animation: bf-pulsar 1.4s ease-in-out infinite; }
      .bf-inicio p { margin: 0; }
      .bf-inicio__recarregar { color: #ff9a3d; opacity: 0; pointer-events: none; animation: bf-mostrar 0s 10s forwards; }
      @keyframes bf-mostrar { to { opacity: 1; pointer-events: auto; } }
      @keyframes bf-pulsar { 50% { opacity: .55; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
